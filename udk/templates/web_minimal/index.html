<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UDK Web Starter</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>Universal Web Starter</h1>
      <p>Clean, accessible, and fast web application baseline.</p>
    </header>

    <section class="card">
      <label for="user-input">Enter Parameter:</label>
      <div class="input-group">
        <input id="user-input" type="text" placeholder="Type something..." />
        <button id="action-btn" type="button">Run Action</button>
      </div>
      <div id="output-box" class="output" aria-live="polite">Ready.</div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
